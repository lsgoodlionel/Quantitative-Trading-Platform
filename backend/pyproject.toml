[tool.poetry]
name = "quantbot-backend"
version = "0.1.0"
description = "QuantBot — Multi-market quantitative trading platform (US/HK/A)"
authors = ["QuantBot Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"

# Web框架
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
websockets = "^13.0"
python-multipart = "^0.0.12"

# 数据验证
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# 数据库
asyncpg = "^0.30.0"
sqlalchemy = { version = "^2.0.36", extras = ["asyncio"] }
alembic = "^1.13.3"

# 缓存/消息队列
redis = { version = "^5.2.0", extras = ["hiredis"] }
celery = { version = "^5.4.0", extras = ["redis"] }

# 认证
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }

# 数据处理
pandas = "^2.2.3"
numpy = "^2.1.0"
pandas-ta = "^0.3.14b"      # 技术指标库
scipy = "^1.14.0"

# 美股数据/交易 (参考 refs/alpaca-py/)
alpaca-py = "^0.34.0"

# 港股数据/交易 (参考 refs/py-futu-api/)
futu-api = "^9.4.5408"

# 通用行情数据（备用）
yfinance = "^0.2.50"
akshare = "^1.14.0"

# 组合优化 (参考 refs/PyPortfolioOpt/)
pyportfolioopt = "^1.5.5"

# 任务调度
apscheduler = "^3.10.4"

# 日志
structlog = "^24.4.0"
loguru = "^0.7.2"

# 告警通知
httpx = "^0.28.0"          # HTTP客户端（Webhook/Telegram）
python-telegram-bot = "^21.7"

# 监控
prometheus-client = "^0.21.0"
opentelemetry-api = "^1.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"           # TestClient
faker = "^30.8.2"
ruff = "^0.14.5"      # 与 requirements-dev.txt / CI 保持一致
mypy = "^1.13.0"
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

# ruff ≥0.2 起 select/ignore 归属 [tool.ruff.lint]；写在顶层会被忽略（此前即如此，
# 等于从未真正启用过规则集）。
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "PT"]
ignore = [
    "E501",
    # 项目刻意把 stdlib 的小写类别名成 PascalCase（`from datetime import date as Date`），
    # 一是避开局部变量 `date` 的遮蔽，二是对齐「类型用 PascalCase」的命名规范
    "N812",
    # 函数内的大写变量在本项目有两类正当来源，逐一豁免不如整体关掉：
    #   1) 量化数学记号：S=现价/协方差、K=行权价、T=到期时间、X=特征矩阵、W=权重
    #      —— 与 BSM/因子模型论文及被测代码保持一致，改成小写反而更难读
    #   2) 函数内常量：BATCH_SIZE、_MAX_ICEBERG_SLICES —— UPPER_SNAKE 本就是项目命名规范
    "N806",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入就是「在参数默认值里调用」，这是框架惯用法而非 B008 所指的可变默认值陷阱。
# 后两个是 @dataclass(frozen=True)，作默认值不存在跨调用共享变更的风险。
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Form", "fastapi.File", "fastapi.Header", "fastapi.Cookie",
    "fastapi.Security",
    "app.quant.factor_fitness.FitnessConfig",
    "app.quant.mining.genetic.GAConfig",
]

[tool.ruff.lint.per-file-ignores]
# 量化/引擎模块的函数参数同样使用数学记号（sqrt_T、Sigma、X/W 矩阵）
"app/quant/**" = ["N803"]
"app/engine/**" = ["N803"]
# PT 是 pytest 风格规则，不该作用于生产代码。
# 否则 FastAPI 端点里 `_user: Annotated[UserInfo, Depends(require_role(...))]`
# 这种「靠依赖注入做鉴权、参数本身不用」的写法会被误判成 pytest fixture。
"app/**" = ["PT"]
# on_start / on_stop 是**可选**生命周期钩子，默认空实现即为正确语义
# （子类按需覆盖）。加 @abstractmethod 会强制所有策略实现它们，与设计相悖。
"app/strategy/base.py" = ["B027", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 覆盖率门禁是「防倒退的 ratchet」，不是目标值。
#
# 目标仍然是 80%。但此前配置写的就是 80，而实际覆盖率长期在 55% 左右 —— 门禁从未通过，
# 结果是所有人都用 `--no-cov` 绕过，等于没有门禁。这里改成「略低于当前实际值」，
# 让它真正起作用：覆盖率一旦下降就红。每次提升覆盖率后，请同步上调此值。
#
#   2026-08-07  55.06% → 57.40%（新增 tests/regression 引擎基线），ratchet 设为 57
#   2026-08-07  57.40% → 59.47%（Wave K-a 订单类型/做空 + K-b 滑点/日历/复权），ratchet 设为 59
#   2026-08-07  59.47% → 61.88%（Wave K-c 组合引擎 + K-d 止损/Insight 框架），ratchet 设为 61
#   2026-08-11  61.88% → 67.49%（Wave L 控制/风控/执行/钩子/实盘接线 + V3 Wave A），ratchet 设为 67
#   2026-08-11  67.49% → 69.59%（Wave M 归档/宇宙/截面算子/Alpha101/产物库/模型模板），ratchet 设为 69
#   2026-08-11  69.59% → 71.32%（Wave N-a 分析报告 + O-a 热加载/CLI/通知），ratchet 设为 71
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=71"

[tool.coverage.run]
omit = ["tests/*", "alembic/*"]
