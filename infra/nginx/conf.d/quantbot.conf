# QuantBot 站点配置
#
# ⚠️⚠️ 上线前必须把下面两处 server_name 的 `quantbot.example.com`
#       改成你的真实域名。这里刻意 **没有** 用 `localhost` 或 `_` 作默认值：
#       带着 localhost 上生产是常见翻车方式（证书 SNI 不匹配、
#       Host 头形同虚设、跳转到错误域名），而 example.com 会立刻暴露问题。
#
# ⚠️ 本文件 **不配置任何安全响应头**（CSP / X-Frame-Options /
#    X-Content-Type-Options / Referrer-Policy / Permissions-Policy / HSTS）。
#    应用层中间件已统一注入，两处都配会产生重复头，部分浏览器行为不确定。
#    详见 README.md「为什么这里没有安全响应头」。

# ── HTTP：仅用于 ACME 校验与跳转 HTTPS ────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name quantbot.example.com;   # ← 改成你的域名

    # Let's Encrypt webroot 校验（certbot 命令见 README）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # 边缘自身健康检查（不与前端容器的 /health 冲突）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：正式入口 ───────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name quantbot.example.com;   # ← 改成你的域名

    # 证书由挂载卷提供，不进仓库。生成/续期见 README.md
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:QB_TLS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # 注意：HSTS(Strict-Transport-Security) 也归应用层中间件负责，此处不设。

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── 指标端点：边缘一律拒绝 ─────────────────────────────────────
    # 必须显式挡掉。前端容器的 nginx.conf 里 /metrics 放行 172.0.0.0/8，
    # 而本反代自身就在 Docker 网段内 —— 若不拦，外网请求会经由边缘
    # 被前端容器判定为「内网来源」而放行，等于把后端指标暴露到公网。
    # Prometheus 走 backend_net 直连 backend:8000，不需要经过这里。
    location = /metrics {
        access_log off;
        return 404;
    }

    # ── WebSocket：实时行情 / 订单 / 持仓推送 ──────────────────────
    # 后端路由：app.include_router(api_router, prefix="/api/v1")
    #           + stream.router prefix="/stream" + @router.websocket("/bars")
    #        ⇒ /api/v1/stream/bars | /orders | /portfolio
    # 单独成块是为了给长连接一个远大于 /api/ 的读超时：
    # 后端每 30s 左右发一次 ping，但行情静默期可能更久，3600s 留足余量。
    location /api/v1/stream/ {
        proxy_pass         http://qb_backend;
        proxy_http_version 1.1;

        # ↓↓↓ WebSocket 握手的两个关键头，删掉会导致「页面能开、行情不动」↓↓↓
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # ↑↑↑ ------------------------------------------------------- ↑↑↑

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;   # 长连接空闲上限
        proxy_send_timeout  3600s;
        proxy_buffering     off;     # 推送要实时，不能攒在缓冲区里
    }

    # ── REST API ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://qb_backend;
        proxy_http_version 1.1;

        # 同样带上升级头：万一将来在 /api/ 下新增 WebSocket 端点而忘了
        # 加 location，这里能兜底。普通请求经 map 得到 Connection: close，
        # 行为与不配时一致，没有副作用。
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 为什么是 300s 而不是默认 60s：
        #   完整验证（/backtests/full-validation）、因子挖掘（/quant/factor-mining）、
        #   稳健性检验、组合优化都是分钟级同步请求。默认 60s 会在跑到一半时
        #   由 Nginx 单方面切断，前端拿到的是 502/网络错误而非「超时」提示，
        #   排查时容易误判成后端崩溃。
        # 如果将来这些任务改成异步任务 + 轮询，这个值应当调回默认。
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # ── 前端静态站（SPA）──────────────────────────────────────────
    location / {
        proxy_pass         http://qb_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
    }
}
