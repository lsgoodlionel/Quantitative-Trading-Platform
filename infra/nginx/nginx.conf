# QuantBot 边缘反向代理 — Nginx 主配置
#
# 职责边界（重要）：
#   本层只做「TLS 终止 + 反向代理 + WebSocket 升级」。
#   不做安全响应头（应用层中间件已统一注入，见 conf.d/quantbot.conf 注释）。
#   不做业务逻辑、不做鉴权、不做限流以外的策略。
#
# 挂载方式见 infra/docker-compose.prod.yml 的 nginx 服务。

user                 nginx;
worker_processes     auto;

error_log            /var/log/nginx/error.log warn;
pid                  /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include           /etc/nginx/mime.types;
    default_type      application/octet-stream;

    # 日志带上 rt/urt，容量摸底（scripts/loadtest）时用得上
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';

    access_log        /var/log/nginx/access.log main;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 75s;

    # 不回显 nginx 版本号。这是代理自身的信息暴露，属于本层职责，
    # 与应用层的安全响应头（CSP / X-Frame-Options / ...）不重叠。
    server_tokens     off;

    # 策略文件上传、批量回测参数等请求体可能偏大
    client_max_body_size 20m;

    # ── WebSocket 升级映射（不要删）────────────────────────────────
    # 平台的实时推送是 FastAPI 的 @router.websocket，挂在
    #   /api/v1/stream/bars | /orders | /portfolio
    # 也就是说 **WebSocket 走的是 /api/ 前缀**，不是单独的 /ws/ 路径。
    #
    # 这个 map 让同一套 proxy_set_header 同时适配普通 HTTP 与 WS 握手：
    #   普通请求  $http_upgrade == ''         → Connection: close
    #   WS 握手   $http_upgrade == 'websocket' → Connection: upgrade
    #
    # 漏掉 Upgrade/Connection 两个头的表现是「页面能打开、行情不动」，
    # 而且前后端都不报错 —— 是最难排查的那类故障。改动前请三思。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── 上游 ───────────────────────────────────────────────────────
    # 说明：这里刻意 **不开** upstream keepalive。
    # keepalive 要求向上游发送 `Connection: ""`，与上面按需下发
    # `Connection: upgrade` 的 map 相互冲突。当前是单实例部署，
    # 连接复用带来的收益远小于 WebSocket 静默失效的代价。
    upstream qb_frontend {
        server frontend:80;
    }

    upstream qb_backend {
        server backend:8000;
    }

    include /etc/nginx/conf.d/*.conf;
}
