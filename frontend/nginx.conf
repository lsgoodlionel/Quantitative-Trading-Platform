# WebSocket 握手需要透传 Upgrade/Connection 两个逐跳头。
# 本文件被挂成 conf.d/default.conf，处在 http {} 上下文内，map 可以写在这里。
#   普通请求  $http_upgrade == ''          → Connection: close
#   WS 握手   $http_upgrade == 'websocket' → Connection: upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # 静态资源长期缓存（Vite 打包带 hash）
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Nginx 健康检查端点
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # API 反向代理 → 后端 FastAPI
    # WebSocket 端点也在这个前缀下（/api/v1/stream/{bars,orders,portfolio,risk}），
    # 所以升级头必须配在这里 —— 此前它们配在下面一个 /ws/ 块里，而后端根本
    # 没有 /ws 路由：那个块永远没有流量，真正承载 WS 的 /api/ 反而没有升级头。
    # 表现是「页面能打开、行情不动」且不报错，是最难查的那类故障。
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # 完整验证、因子挖掘是分钟级请求；WS 长连接同样吃这个超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # Prometheus 指标（仅内网访问）
    location /metrics {
        proxy_pass http://backend:8000/metrics;
        allow 172.0.0.0/8;  # Docker 内网
        deny all;
    }

    # SPA 路由 — 所有未匹配路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
